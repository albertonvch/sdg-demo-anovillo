name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_WORKSPACE_NAME: dev

jobs:
  descubrir:
    runs-on: ubuntu-latest
    outputs:
      capas: ${{ steps.listar.outputs.capas }}
    steps:
      - uses: actions/checkout@v5
      - id: listar
        run: |
          capas=$(find . -maxdepth 1 -type d -name '[0-9][0-9]_*' -printf '%f\n' \
            | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "capas=$capas" >> "$GITHUB_OUTPUT"
          echo "Capas encontradas: $capas"

  plan:
    needs: descubrir
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        capa: ${{ fromJson(needs.descubrir.outputs.capas) }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Plan de ${{ matrix.capa }}
        working-directory: ${{ matrix.capa }}
        run: |
          terraform init
          terraform workspace select -or-create "$TF_WORKSPACE_NAME"
          terraform plan -no-color