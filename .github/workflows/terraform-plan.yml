name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  descubrir:
    runs-on: ubuntu-latest
    outputs:
      rutas: ${{ steps.listar.outputs.rutas }}
    steps:
      - uses: actions/checkout@v5

      - id: listar
        run: |
          rutas=$(for entorno in hub dev; do
                    find "$entorno" -mindepth 1 -maxdepth 1 -type d \
                      -name '[0-9][0-9]_*' -printf '%f\n' \
                      | sort | sed "s|^|$entorno/|"
                  done | jq -R -s -c 'split("\n")[:-1]')
          echo "rutas=$rutas" >> "$GITHUB_OUTPUT"
          echo "Encontradas: $rutas"

  plan:
    needs: descubrir
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruta: ${{ fromJson(needs.descubrir.outputs.rutas) }}
    defaults:
      run:
        working-directory: ${{ matrix.ruta }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init
        run: |
          terraform init \
            -backend-config=../../backend.hcl \
            -backend-config="key=${{ matrix.ruta }}.tfstate"

      - name: Plan
        run: terraform plan -no-color -var-file=../terraform.tfvars
