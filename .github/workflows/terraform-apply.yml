name: Terraform Apply

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  descubrir:
    runs-on: ubuntu-latest
    outputs:
      rutas: ${{ steps.listar.outputs.rutas }}
    steps:
      - uses: actions/checkout@v5

      - id: listar
        run: |
          rutas=$(for entorno in hub dev; do
                    find "$entorno" -mindepth 1 -maxdepth 1 -type d \
                      -name '[0-9][0-9]_*' -printf '%f\n' \
                      | sort | sed "s|^|$entorno/|"
                  done | jq -R -s -c 'split("\n")[:-1]')
          echo "rutas=$rutas" >> "$GITHUB_OUTPUT"
          echo "Encontradas: $rutas"

  apply:
    needs: descubrir
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Apply en orden
        run: |
          set -euo pipefail
          for ruta in $(echo '${{ needs.descubrir.outputs.rutas }}' | jq -r '.[]'); do
            echo "::group::$ruta"
            terraform -chdir="$ruta" init \
              -backend-config=../../backend.hcl \
              -backend-config="key=$ruta.tfstate"
            terraform -chdir="$ruta" apply -auto-approve -lock-timeout=5m \
              -var-file=../terraform.tfvars
            echo "::endgroup::"
          done
